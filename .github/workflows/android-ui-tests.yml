name: Android Student Journey Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnmate-android-ui-tests
  cancel-in-progress: true

jobs:
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Firebase from repository secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is required to build the Android test APK."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq -e '.project_info.project_id and any(.client[]; .client_info.android_client_info.package_name == "com.learnmate.app")' app/google-services.json >/dev/null

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run student journey UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "Connected Android devices:"
            adb devices -l
            adb wait-for-device
            echo "Emulator boot status:"
            adb shell getprop sys.boot_completed
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
