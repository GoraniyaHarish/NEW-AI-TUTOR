name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest main-branch CI run active while iterating quickly.
concurrency:
  group: learnmate-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      firebase_configured: ${{ steps.firebase_config.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Firebase from repository secret
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON is not configured. Tests and the APK build can run, but the APK will not have Firebase AI Logic configured. The release can still be published with offline features."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            jq -e '.project_info.project_id and any(.client[]; .client_info.android_client_info.package_name == "com.learnmate.app")' app/google-services.json >/dev/null
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        id: build_apk
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: learnmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  android-ui-tests:
    runs-on: ubuntu-latest
    # Emulator startup can take up to 20 minutes; leave time for Gradle and instrumentation tests.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run student journey UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Allow slower GitHub-hosted runners extra time to start the emulator.
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "Connected Android devices:"
            adb devices -l
            adb wait-for-device
            echo "Emulator boot status:"
            adb shell getprop sys.boot_completed
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    # Publish when unit tests and APK compilation pass. Emulator UI tests still run independently,
    # but a flaky hosted emulator must not prevent students/mentors from getting the installable APK.
    needs: [build-and-publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@v4

      - name: Download tested APK artifact
        uses: actions/download-artifact@v4
        with:
          name: learnmate-debug-apk
          path: dist

      - name: Verify this is still the latest main commit
        id: latest
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tested APK to GitHub Releases
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LearnMate build #${{ github.run_number }}
          body: |
            Installable LearnMate Android debug APK built from the main branch.
            Unit tests and APK compilation passed for this source revision. Emulator student-journey UI tests run in a separate Actions job and do not block this release; check the workflow run for their result.

            **Cloud AI configuration:** ${{ needs.build-and-publish.outputs.firebase_configured == 'true' && 'Firebase AI Logic configuration was included in this build.' || 'Firebase AI Logic is not configured in this build; offline/local features remain available. Configure the GOOGLE_SERVICES_JSON Actions secret to enable cloud AI in future builds.' }}

            **Install:** Download `app-debug.apk` to an Android device and open it. Allow installation from this source if Android asks. This debug build is for testing and mentor demonstrations, not a Play Store release.
          files: dist/app-debug.apk
          make_latest: true
