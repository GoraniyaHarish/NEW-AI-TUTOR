name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run student journey UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell pm clear com.learnmate.app || true
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload unit and emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LearnMate build #${{ github.run_number }}
          body: |
            Automatically generated installable Android APK from the latest successful main-branch CI run.

            **Install:** Download `app-debug.apk` below, open it on your Android device, and allow installation from this source if Android asks. This is a debug build for testing and mentor demonstrations, not a Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: learnmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
