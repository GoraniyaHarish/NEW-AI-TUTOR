name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      # Build the installable APK before emulator tests. A flaky emulator must not
      # prevent a build that passed compilation and unit tests from being published.
      - name: Build debug APK
        id: build_apk
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: learnmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run student journey UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb devices
            adb shell getprop sys.boot_completed
            bash ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload unit and emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      # Publish after the build even if emulator boot/UI tests fail.
      - name: Publish APK to GitHub Releases
        if: always() && steps.build_apk.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LearnMate build #${{ github.run_number }}
          body: |
            Installable LearnMate Android debug APK built from the main branch.
            Unit tests and APK compilation must pass for this artifact to be produced. Check the linked Actions run for the separate emulator UI-test result.

            **Install:** Download `app-debug.apk` to an Android device and open it. Allow installation from this source if Android asks. This debug build is for testing and mentor demonstrations, not a Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
