name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest main-branch CI run active while iterating quickly.
concurrency:
  group: learnmate-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      firebase_configured: ${{ steps.firebase_config.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Firebase from repository secret
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is required. Add the valid app/google-services.json content as a GitHub Actions secret before building a release."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq -e '.project_info.project_id and any(.client[]; .client_info.android_client_info.package_name == "com.learnmate.app")' app/google-services.json >/dev/null
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Validate release-signing secrets and decode persistent keystore
        id: release_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::All four Android signing secrets are required to publish a production-signed APK."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/learnmate-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build production-signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/learnmate-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease -PVERSION_CODE=${{ github.run_number }} --stacktrace

      - name: Upload production-signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnmate-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14


  publish-release:
    # Publish only after Firebase configuration, unit tests, signing validation, and release APK compilation pass.
    needs: [build-and-publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@v4

      - name: Download production-signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: learnmate-release-apk
          path: dist-release

      - name: Prepare APK release asset
        run: |
          mkdir -p dist
          cp dist-release/app-release.apk dist/learnmate.apk

      - name: Verify this is still the latest main commit
        id: latest
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tested APK to GitHub Releases
        if: steps.latest.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LearnMate build #${{ github.run_number }}
          body: |
            Installable LearnMate Android APK built from the main branch.
            Unit tests and production-signed APK compilation passed for this source revision. Full Android student-journey UI tests are available as a separate manually triggered workflow.

            **APK type:** Production-signed release APK.

            **Cloud AI configuration:** Firebase configuration was validated and included in this build. Live AI still depends on Firebase Console, API access, and App Check setup.

            **Install:** Download learnmate.apk to an Android device and open it. Allow installation from this source if Android asks. Keep the same release signing keystore for all updates.
          files: dist/learnmate.apk
          make_latest: true
